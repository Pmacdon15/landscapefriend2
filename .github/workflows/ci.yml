name: CI

on:
  pull_request:
  push:
    branches: [master, "ci/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # TEMP: commit the regenerated lockfile back to the branch.
      - name: Commit bun.lock
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet bun.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          bun install
          git add bun.lock
          git commit -m "chore: update bun.lock for test dependencies"
          git push origin "HEAD:$HEAD_REF"

      - name: Lint
        run: bunx biome ci .

      - name: Typecheck
        # Re-emit tsc errors as GitHub annotations so they show inline on PRs.
        run: |
          bunx next typegen
          if bunx tsc --noEmit --pretty false > tsc.log 2>&1; then exit 0; fi
          sed -E 's/^([^(]+)\(([0-9]+),([0-9]+)\): (.*)$/::error file=\1,line=\2,col=\3::\4/' tsc.log | head -n 50
          exit 1

      - name: Test
        run: |
          bun run test 2>&1 | tee test.log
          echo "::notice::$(grep -E 'Test Files|Tests ' test.log | tr -s ' ' | tr '\n' ' ')"
          exit "${PIPESTATUS[0]}"

  e2e:
    # Needs a Clerk dev instance and a throwaway database (see
    # tests/e2e/README.md). Skipped until those secrets are added.
    runs-on: ubuntu-latest
    needs: check
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      E2E_CLERK_ORG_ID: ${{ secrets.E2E_CLERK_ORG_ID }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.E2E_BLOB_READ_WRITE_TOKEN }}
    steps:
      - name: Check for E2E secrets
        id: secrets
        run: |
          if [ -n "$CLERK_SECRET_KEY" ] && [ -n "$DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::E2E secrets not set; skipping Playwright tests."
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5

      - if: steps.secrets.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2

      - if: steps.secrets.outputs.ready == 'true'
        run: bun install

      - if: steps.secrets.outputs.ready == 'true'
        run: bunx playwright install --with-deps chromium

      - if: steps.secrets.outputs.ready == 'true'
        run: bun run test:e2e

      - if: failure() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
