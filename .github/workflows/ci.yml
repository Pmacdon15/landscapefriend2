name: CI

on:
  pull_request:
  push:
    branches: [master, "ci/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx biome ci .

      - name: Typecheck
        # Re-emit tsc errors as GitHub annotations so they show inline on PRs.
        run: |
          if bunx tsc --noEmit --pretty false > tsc.log 2>&1; then exit 0; fi
          sed -E 's/^([^(]+)\(([0-9]+),([0-9]+)\): (.*)$/::error file=\1,line=\2,col=\3::\4/' tsc.log | head -n 50
          exit 1

      - name: Test
        run: bun run test
